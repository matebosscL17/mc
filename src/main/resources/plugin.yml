name: SMPCore
version: '1.1.0'
main: hu.smpcore.SMPCore
api-version: '1.21'
description: SMP csomag - sírkő, gazdaság, shop, aukciósház, foglalkozások, fejpénz, napi jutalom, toplisták, AFK, mentés
commands:
  rules:
    description: Szerver szabályok
  discord:
    description: Discord meghívó
  death:
    description: Utolsó halálod helye
  smpcore:
    description: SMPCore admin parancsok (/smpcore reload)
  balance:
    description: Egyenleg
    aliases: [bal, money]
    usage: /balance [játékos]
  pay:
    description: Pénz küldése
    usage: /pay [játékos] [összeg]
  baltop:
    description: Leggazdagabbak
    aliases: [balancetop]
  eco:
    description: Admin gazdaság parancs
    usage: /eco [give|take|set] [játékos] [összeg]
  shop:
    description: Shop megnyitása
  sell:
    description: Eladás (kézben lévő tárgy, vagy /sell all)
    usage: /sell [all]
  graves:
    description: Sírjaid listája
  bounty:
    description: Fejpénz kitűzése
    usage: /bounty [játékos] [összeg] | /bounty list
  daily:
    description: Napi jutalom
  sidebar:
    description: Oldalsó scoreboard ki/be
  top:
    description: Toplisták
    usage: /top [playtime|kills|deaths|balance]
  jobs:
    description: Foglalkozásaid szintje
  ah:
    description: Aukciósház
    aliases: [auction, auctionhouse]
    usage: /ah | /ah sell [ár] | /ah my
  afk:
    description: AFK mód ki/be
  backup:
    description: Világ mentése most (admin)
  lobby:
    description: Lobby (spawn). Adminoknak /lobby set és /lobby build
    aliases: [hub, spawn]
    usage: /lobby | /lobby set | /lobby build
  rtp:
    description: Véletlen teleport a vadonba
    aliases: [wild]
  crate:
    description: Ládák (nyitás kulccsal), admin beállítás
    aliases: [crates]
    usage: /crate list | buy <id> | set <id> | place <id> | remove | givekey <játékos> <id> [db]
  bind:
    description: Blokk vagy NPC parancshoz kötése (admin)
    usage: /bind <parancs> | remove | list | npc <név> <parancs>
  holo:
    description: Toplista hologramok (admin)
    usage: /holo create <playtime|kills|deaths|balance> | remove | list
  rank:
    description: Rangok kezelése (admin)
    usage: /rank set [játékos] [rang] | remove [játékos] | list
  msg:
    description: Privát üzenet
    aliases: [w, tell, m]
    usage: /msg [játékos] [üzenet]
  reply:
    description: Válasz az utolsó privát üzenetre
    aliases: [r]
    usage: /r [üzenet]
  sethome:
    description: Otthon beállítása
    usage: /sethome [név]
  home:
    description: Teleport az otthonodba
    usage: /home [név]
  delhome:
    description: Otthon törlése
    usage: /delhome [név]
  homes:
    description: Otthonaid listája
  back:
    description: Vissza az előző helyre (halál után is)
  tpa:
    description: Teleport kérés egy játékoshoz
    usage: /tpa [játékos]
  tpaccept:
    description: Teleport kérés elfogadása
    aliases: [tpyes]
  tpdeny:
    description: Teleport kérés elutasítása
    aliases: [tpno]
  tpcancel:
    description: Saját teleport kérés visszavonása
  warp:
    description: Teleport egy warpra
    usage: /warp [név]
  warps:
    description: Warpok listája
  setwarp:
    description: Warp létrehozása (admin)
    usage: /setwarp [név]
  delwarp:
    description: Warp törlése (admin)
    usage: /delwarp [név]
  claim:
    description: Terület védelem (chunk)
    aliases: [chunk]
    usage: /claim | trust [játékos] | untrust [játékos] | info | list | show
  unclaim:
    description: Chunk felszabadítása (részleges visszatérítés)
  spawnzone:
    description: A védett spawn terület kijelölése (admin)
    aliases: [szone]
    usage: /spawnzone pos1 | pos2 | set x1 z1 x2 z2 | undo | clear | info | show
  guide:
    description: Parancsok és tippek új játékosoknak
    aliases: [segitseg, info]
permissions:
  smpcore.admin:
    description: /smpcore reload, /eco, védett sírok megnyitása
    default: op

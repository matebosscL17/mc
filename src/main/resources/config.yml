  player-not-found: "<red>Nincs ilyen játékos: <player>"
  invalid-amount: "<red>Érvénytelen összeg."
  not-enough-money: "<red>Nincs elég pénzed. <gray>(Kell: <amount>)"

  # Gazdaság
  balance-self: "<gray>Egyenleged: <gold><amount>"
  balance-other: "<gray><player> egyenlege: <gold><amount>"
  pay-usage: "<gray>Használat: /pay [játékos] [összeg]"

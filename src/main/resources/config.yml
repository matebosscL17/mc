# SMPCore beállítások
# Szövegekben MiniMessage formázás használható: <red>, <gold>, <bold>, <gradient:red:blue> ...
# Placeholderek a szövegektől függően: <player>, <x>, <y>, <z>, <world>, <amount> stb.
# Módosítás után: /smpcore reload

join-quit:
  enabled: true
  join: "<green>+ <white><player> <gray>csatlakozott"
  first-join: "<gold>★ <white><player> <gold>először csatlakozott a szerverre! Üdv!"
  quit: "<red>- <white><player> <gray>kilépett"

welcome-title:
  enabled: true
  title: "<gradient:gold:yellow><bold>Üdv, <player>!"
  subtitle: "<gray>Érezd jól magad a szerveren"

death-coords:
  enabled: true
  message: "<red>Meghaltál itt: <white><x>, <y>, <z> <gray>(<world>) <dark_gray>- /death"
  command-none: "<gray>Még nem haltál meg a legutóbbi újraindítás óta."

player-heads:
  # PvP-s gyilkosságnál a halott játékos feje eldobódik
  enabled: true
  # 1.0 = mindig, 0.5 = 50%
  chance: 1.0
  name: "<!italic><yellow><player> feje"

graves:
  # Halálkor a tárgyak egy játékos-fej blokkba kerülnek a halál helyén (jobb klikk = kinyitás)
  enabled: true
  # Ennyi percig csak a tulajdonos nyithatja ki
  protected-minutes: 5
  # A tapasztalati pont is a sírba kerül
  keep-exp: true

economy:
  currency: "$"
  start-balance: 100

bounty:
  # Minimum fejpénz összeg
  min: 100

daily:
  timezone: "Europe/Budapest"
  base: 100
  # Minden egymás utáni nap után ennyivel több
  bonus-per-day: 20
  # Ennyi napig nő a bónusz
  max-streak-days: 7

# Oldalsó scoreboard (a képernyő jobb szélén). Legfeljebb 15 sor.
# Placeholderek: <player>, <money>, <kills>, <deaths>, <playtime>, <online>, <max>
# Üres sor: ""
sidebar:
  enabled: true
  # IDE ÍRD A SZERVER NEVÉT
  title: "<gradient:gold:yellow><bold>SZERVER NEVE"
  lines:
    - "<gray>Játékos: <white><player>"
    - ""
    - "<gold>Pénz: <white><money>"
    - "<red>Ölés: <white><kills> <gray>| <red>Halál: <white><deaths>"
    - "<aqua>Játszott idő: <white><playtime>"
    - ""
    - "<green>Online: <white><online><gray>/<white><max>"
    - "<dark_gray>play.szerver.hu"

# Shop: főmenü kategóriákkal, minden kategória lapozható (oldalanként 45 tárgy).
# buy = ennyiért vehető meg (0 = nem vehető), sell = ennyiért adható el (0 = nem adható el).
# Tipp: az eladási ár legyen mindig kisebb, mint a vételár.
# Új kategória: másolj egy blokkot, adj neki új kulcsot. Legfeljebb 14 kategória fér a menübe.
shop:
  title: "<gold><bold>Shop"
  categories:
    blocks:
      icon: BRICKS
      name: "<!italic><green>Építőanyag"

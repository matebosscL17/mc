# SMPCore beállítások
# Szövegekben MiniMessage formázás használható: <red>, <gold>, <bold>, <gradient:red:blue> ...
# Placeholderek a szövegektől függően: <player>, <x>, <y>, <z>, <world>, <amount> stb.
# Módosítás után: /smpcore reload

join-quit:
  enabled: true
  join: "<green>+ <white><player> <gray>csatlakozott"
  first-join: "<gold>★ <white><player> <gold>először csatlakozott a Penthouse SMP-re! Üdv!"
  quit: "<red>- <white><player> <gray>kilépett"

welcome-title:
  enabled: true
  title: "<gradient:#ffd700:#ff8c00><bold>PENTHOUSE SMP"
  subtitle: "<gray>Üdv, <white><player><gray>! Érezd jól magad."

death-coords:
  enabled: true
  message: "<red>Meghaltál itt: <white><x>, <y>, <z> <gray>(<world>) <dark_gray>- /death"
  command-none: "<gray>Még nem haltál meg a legutóbbi újraindítás óta."

player-heads:
  # PvP-s gyilkosságnál a halott játékos feje eldobódik
  enabled: true
  # 1.0 = mindig, 0.5 = 50%
  chance: 1.0
  name: "<!italic><yellow><player> feje"

graves:
  # Halálkor a tárgyak egy játékos-fej blokkba kerülnek a halál helyén (jobb klikk = kinyitás)
  enabled: true
  # Ennyi percig csak a tulajdonos nyithatja ki
  protected-minutes: 5
  # A tapasztalati pont is a sírba kerül
  keep-exp: true

economy:
  currency: "$"
  start-balance: 100

bounty:
  # Minimum fejpénz összeg
  min: 100

daily:
  timezone: "Europe/Budapest"
  base: 100
  # Minden egymás utáni nap után ennyivel több
  bonus-per-day: 20
  # Ennyi napig nő a bónusz
  max-streak-days: 7

# Oldalsó scoreboard (a képernyő jobb szélén). Legfeljebb 15 sor.
# Placeholderek: <player>, <money>, <kills>, <deaths>, <playtime>, <online>, <max>
# Színek: <#ffd700> formátumban hex is használható. Üres sor: ""
sidebar:
  enabled: true
  title: "<gradient:#ffd700:#ff8c00><bold>✦ PENTHOUSE SMP ✦"
  lines:
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    - "<#ffd700>◆ <gray>Játékos<dark_gray>: <white><player>"
    - "<#ffd700>◆ <gray>Pénz<dark_gray>: <green><money>"
    - ""
    - "<red>⚔ <gray>Ölés<dark_gray>: <white><kills>  <dark_red>☠ <gray>Halál<dark_gray>: <white><deaths>"
    - "<#55ffff>◆ <gray>Játszott idő<dark_gray>: <white><playtime>"
    - ""
    - "<green>● <gray>Online<dark_gray>: <white><online><dark_gray>/<gray><max>"
    - "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    - "<#ffd700>   play.szerver.hu"


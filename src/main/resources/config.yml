    BLAZE_ROD: { buy: 0, sell: 25 }

rules:
  lines:
    - "<gold><bold>Szerver szabályok"
    - "<yellow>1. <white>Tilos a griefelés és a lopás."
    - "<yellow>2. <white>Tilos a csalás és a tiltott modok."
    - "<yellow>3. <white>Tiszteld a többi játékost."
    - "<yellow>4. <white>Ne spamelj a chaten."

discord:
  message: "<aqua>Discord: <click:open_url:'https://discord.gg/IDE_IRD_A_LINKET'><underlined>discord.gg/IDE_IRD_A_LINKET</underlined></click>"

# Üzenetek. A hiányzó kulcsok helyén "[hiányzó üzenet: ...]" jelenik meg.
messages:
  player-only: "<red>Ezt a parancsot csak játékos használhatja."
  no-permission: "<red>Ehhez nincs jogosultságod."
  reloaded: "<green>SMPCore konfig újratöltve."
  usage-smpcore: "<gray>Használat: /smpcore reload"
  player-not-found: "<red>Nincs ilyen játékos: <player>"
  invalid-amount: "<red>Érvénytelen összeg."
  not-enough-money: "<red>Nincs elég pénzed. <gray>(Kell: <amount>)"

  # Gazdaság
  balance-self: "<gray>Egyenleged: <gold><amount>"
  balance-other: "<gray><player> egyenlege: <gold><amount>"
  pay-usage: "<gray>Használat: /pay [játékos] [összeg]"
  pay-self: "<red>Magadnak nem küldhetsz pénzt."
  pay-sent: "<green>Elküldtél <gold><amount> <green>pénzt neki: <white><player>"
  pay-received: "<green>Kaptál <gold><amount> <green>pénzt tőle: <white><player>"
  baltop-header: "<gold><bold>Leggazdagabbak"
  top-line: "<yellow><rank>. <white><player> <gray>- <white><value>"
  eco-usage: "<gray>Használat: /eco [give|take|set] [játékos] [összeg]"
  eco-done: "<green>Kész. <white><player> egyenlege: <gold><amount>"

  # Shop
  shop-lore-buy: "<!italic><green>Vétel: <white><price> <dark_gray>(bal klikk: 1, shift: 16)"
  shop-lore-sell: "<!italic><red>Eladás: <white><price> <dark_gray>(jobb klikk: 1, shift: 16)"
  shop-cannot-buy: "<red>Ezt nem lehet megvenni."
  shop-not-sellable: "<red>Ezt nem lehet eladni (vagy elnevezett/enchantolt tárgy)."
  shop-inv-full: "<red>Tele a táskád, a ki nem fért tárgyak árát visszakaptad."
  shop-bought: "<green>Vettél <white><count>x <item> <green>tárgyat: <gold><price>"
  shop-sold: "<green>Eladtál <white><count>x <item> <green>tárgyat: <gold><price>"
  shop-sold-all: "<green>Eladtál <white><count> <green>tárgyat összesen: <gold><price>"
  shop-nothing: "<red>Nincs nálad eladható tárgy."

  # Sírkő
  grave-created: "<gray>Sírod: <white><x>, <y>, <z> <gray>(<world>) <dark_gray>- jobb klikk a fejre. Mások <minutes> perc múlva nyithatják."
  grave-break: "<red>A sírt nem lehet kitörni, kattints rá jobb gombbal."
  grave-protected: "<red>Ez a sír még védett, még kb. <minutes> percig csak a tulajdonosa nyithatja."
  grave-claimed: "<green>Kinyitottad a sírt, megkaptad a cuccaidat."
  graves-header: "<gold>Sírjaid:"
  graves-line: "<gray>- <white><x>, <y>, <z> <gray>(<world>)"
  graves-none: "<gray>Nincs sírod."

  # Fejpénz
  bounty-usage: "<gray>Használat: /bounty [játékos] [összeg] vagy /bounty list"
  bounty-self: "<red>Magadra nem tűzhetsz ki fejpénzt."
  bounty-min: "<red>A minimum összeg: <amount>"
  bounty-placed: "<red>☠ <white><setter> <gray>fejpénzt tűzött ki <white><player> <gray>fejére: <gold><amount> <gray>(összesen: <gold><total><gray>)"
  bounty-claimed: "<gold>☠ <white><killer> <gray>megölte <white><victim> <gray>játékost, és megkapta a fejpénzt: <gold><amount>"
  bounty-list-header: "<gold><bold>Fejpénzek"
  bounty-none: "<gray>Nincs aktív fejpénz."

  # Napi jutalom
  daily-reward: "<green>Napi jutalom: <gold><amount> <gray>(széria: <white><streak> <gray>nap)"
  daily-already: "<red>Ma már felvetted. <gray>Következő: <white><time> <gray>múlva."
  daily-hint: "<yellow>Felveheted a napi jutalmadat: <white>/daily"

  # Toplisták
  top-usage: "<gray>Használat: /top [playtime|kills|deaths|balance]"
  top-title-playtime: "<gold><bold>Top játszott idő"
  top-title-kills: "<gold><bold>Top gyilkosok"
  top-title-deaths: "<gold><bold>Legtöbbet haltak"
  top-title-balance: "<gold><bold>Leggazdagabbak"

  # Sidebar
  sidebar-on: "<green>Az oldalsó scoreboard bekapcsolva."
  sidebar-off: "<gray>Az oldalsó scoreboard kikapcsolva. (/sidebar a visszakapcsoláshoz)"

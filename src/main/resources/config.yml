    SAND: { buy: 4, sell: 1 }
    GLASS: { buy: 8, sell: 2 }
    TORCH: { buy: 4, sell: 1 }
    COAL: { buy: 20, sell: 8 }
    COPPER_INGOT: { buy: 15, sell: 5 }
    IRON_INGOT: { buy: 50, sell: 20 }
    GOLD_INGOT: { buy: 80, sell: 32 }
    REDSTONE: { buy: 12, sell: 4 }
    LAPIS_LAZULI: { buy: 15, sell: 5 }
    DIAMOND: { buy: 400, sell: 150 }
    EMERALD: { buy: 150, sell: 60 }
    OBSIDIAN: { buy: 60, sell: 20 }
    BREAD: { buy: 12, sell: 4 }
    COOKED_BEEF: { buy: 15, sell: 5 }
    GOLDEN_APPLE: { buy: 250, sell: 80 }
    ARROW: { buy: 3, sell: 1 }
    ENDER_PEARL: { buy: 120, sell: 40 }
    EXPERIENCE_BOTTLE: { buy: 40, sell: 10 }
    WHEAT: { buy: 0, sell: 3 }
    CARROT: { buy: 0, sell: 3 }
    POTATO: { buy: 0, sell: 3 }
    SUGAR_CANE: { buy: 0, sell: 2 }
    PUMPKIN: { buy: 0, sell: 3 }
    BONE: { buy: 0, sell: 2 }
    STRING: { buy: 0, sell: 2 }
    GUNPOWDER: { buy: 0, sell: 6 }

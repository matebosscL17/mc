# Foglalkozások: munkáért pénz jár, szintenként nő a jutalom.
# Játékos által lerakott blokkért és éretlen terményért nem jár pénz.
jobs:
  enabled: true
  # Ennyi munka után lép szintet
  actions-per-level: 300
  max-level: 10
  # Szintenként ennyi százalékkal nő a jutalom
  bonus-percent-per-level: 5
  blocks:
    miner:
      COAL_ORE: 2
      DEEPSLATE_COAL_ORE: 2
      COPPER_ORE: 2
      DEEPSLATE_COPPER_ORE: 2
      IRON_ORE: 4
      DEEPSLATE_IRON_ORE: 4
      GOLD_ORE: 6
      DEEPSLATE_GOLD_ORE: 6
      REDSTONE_ORE: 3
      DEEPSLATE_REDSTONE_ORE: 3
      LAPIS_ORE: 4
      DEEPSLATE_LAPIS_ORE: 4
      DIAMOND_ORE: 15
      DEEPSLATE_DIAMOND_ORE: 15
      EMERALD_ORE: 15
      DEEPSLATE_EMERALD_ORE: 15
      NETHER_QUARTZ_ORE: 3
      NETHER_GOLD_ORE: 3
      ANCIENT_DEBRIS: 30
    farmer:
      WHEAT: 2
      CARROTS: 2
      POTATOES: 2
      BEETROOTS: 2
      NETHER_WART: 2
      PUMPKIN: 2
      MELON: 2
      SUGAR_CANE: 1
  # Mob ölés (vadász foglalkozás)
  mobs:
    ZOMBIE: 3
    SKELETON: 3
    SPIDER: 3
    CREEPER: 4
    ENDERMAN: 6
    WITCH: 8
    BLAZE: 6
    WITHER_SKELETON: 10
    COW: 1
    PIG: 1
    SHEEP: 1
    CHICKEN: 1

# Aukciósház: /ah, /ah sell [ár], /ah my
auction:
  title: "<gold><bold>Aukciósház <gray>(<page>/<pages>)"
  title-mine: "<gold><bold>Saját hirdetéseim <gray>(<page>/<pages>)"
  min-price: 1
  # Játékosonként legfeljebb ennyi hirdetés
  max-listings: 5
  # Eladáskor ennyi százalék adót vonunk le az eladótól
  tax-percent: 5

# Kezdőcsomag első belépéskor (TÁRGY:darab)
starter-kit:
  enabled: true
  items:
    - "STONE_PICKAXE:1"
    - "STONE_AXE:1"
    - "STONE_SWORD:1"
    - "BREAD:16"
    - "TORCH:32"

# Védett spawn: az alapvilág spawn pontja körül nem lehet építeni és (alapból) PvP-zni.
# Az smpcore.admin joggal (op) rendelkezők kivételek.
spawn-protection:
  enabled: true
  radius: 24
  pvp: false

# AFK: tétlen játékos AFK jelzést kap a tablistán.
afk:
  enabled: true
  after-seconds: 300
  # 0 = nincs kirúgás, különben ennyi perc tétlenség után kirúgjuk
  kick-minutes: 0
  broadcast: true

# Automatikus világmentés a szerver mappa "backups" mappájába (zip).
backup:
  enabled: true
  interval-minutes: 120
  # Ennyi legutóbbi mentést tartunk meg
  keep: 10
  folder: "backups"

rules:
  lines:
    - "<gold><bold>Szerver szabályok"
    - "<yellow>1. <white>Tilos a griefelés és a lopás."
    - "<yellow>2. <white>Tilos a csalás és a tiltott modok."
    - "<yellow>3. <white>Tiszteld a többi játékost."
    - "<yellow>4. <white>Ne spamelj a chaten."

discord:
  message: "<aqua>Discord: <click:open_url:'https://discord.gg/IDE_IRD_A_LINKET'><underlined>discord.gg/IDE_IRD_A_LINKET</underlined></click>"

# Üzenetek. A hiányzó kulcsok helyén "[hiányzó üzenet: ...]" jelenik meg.

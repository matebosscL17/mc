name: Build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build
        run: mvn -B package
      - name: Resource pack
        run: python3 tools/build_pack.py
      - uses: actions/upload-artifact@v4
        with:
          name: SMPCore
          path: target/SMPCore.jar
      - name: Server package
        run: |
          mkdir -p stage
          cp -r server/. stage/
          mkdir -p stage/plugins
          cp target/SMPCore.jar stage/plugins/SMPCore.jar
          URL=$(curl -sL https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['downloads']['server:default']['url'])" || true)
          if [ -n "$URL" ]; then curl -sL "$URL" -o stage/paper.jar || true; fi
          ls -la stage
          (cd stage && zip -qr ../penthouse-smp-server.zip .)
      # Közvetlen letöltési link a jarhoz: Releases -> legutóbbi kiadás
      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest target/SMPCore.jar build/penthouse-pack.zip build/pack.sha1 penthouse-smp-server.zip \
            --title "SMPCore (legújabb)" \
            --notes "Automatikusan lefordított SMPCore.jar. Töltsd le, és másold a szerver plugins mappájába." \
            --target "${{ github.sha }}"

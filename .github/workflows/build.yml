name: Build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: SMPCore
          path: target/SMPCore.jar
      # Közvetlen letöltési link a jarhoz: Releases -> legutóbbi kiadás
      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest target/SMPCore.jar \
            --title "SMPCore (legújabb)" \
            --notes "Automatikusan lefordított SMPCore.jar. Töltsd le, és másold a szerver plugins mappájába." \
            --target "${{ github.sha }}"
